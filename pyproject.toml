[project]
name = "yield-curve"
dynamic = ["version"]

description = "Yield curve bootstrapping and portfolio analysis — a quantitative finance toolkit."

readme = "README.md"

requires-python = ">=3.9"

license = {text = "LicenseRef-Proprietary"}

keywords = [
  "yield-curve", "bootstrapping", "finance", "quantitative",
  "portfolio-optimization", "Nelson-Siegel", "spot-rates",
  "forward-rates",
]

classifiers = [
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Topic :: Office/Business :: Financial",
  "Topic :: Scientific/Engineering :: Mathematics",
  "License :: Other/Proprietary License",
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "numpy>=1.20.0",
  "scipy>=1.7.0",
  "pandas>=1.3.0",
  "matplotlib>=3.4.0",
  "seaborn>=0.11.0",
  "numpy-financial>=0.2",
]

[project.optional-dependencies]
yfinance = ["yfinance>=0.2.0"]
dev = [
  "pytest>=6.0.0",
  "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/omarja12/Bootstrap-Yield-Curve"
"Bug Tracker" = "https://github.com/omarja12/Bootstrap-Yield-Curve/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/yield_curve/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/yield_curve"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "N",
  "W",
  "B",
  "C4",
]
ignore = [
  "E501",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.ruff.lint.isort]
known-first-party = ["yield_curve"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
